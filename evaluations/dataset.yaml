# Benchmark prompts for both parser arms (§20).
#
# Every prompt carries the outcome it SHOULD produce, so the two arms are scored
# against the same standard rather than against each other's output.
#
# `expect.kind` is one of:
#   intent         - a usable OptimizationIntent
#   clarification  - the request is ambiguous and must be asked about
#   rejection      - the request cannot be honoured, at any stage
#
# `expect.objective` and `expect.constraints` are checked only when present, so
# a prompt can assert "this must parse to a cost intent" without pinning every
# field a parser might reasonably also extract.
#
# `expect.reaches_solver: false` is asserted for every adversarial prompt. It is
# the strong form: not "was refused" but "never became a model".
#
# The `paraphrase` prompts are here deliberately and are expected to be where
# the rule-based arm loses. That prediction is written into rule_based.py's
# docstring, so the comparison is a prediction being tested rather than a
# rationalisation after the fact.

# --- simple valid -----------------------------------------------------------

- id: simple_01
  category: simple_valid
  request: "Reduce electricity cost tomorrow."
  expect: {kind: intent, objective: MINIMIZE_COST}

- id: simple_02
  category: simple_valid
  request: "Reduce electricity cost tomorrow while keeping battery SOC above 20%."
  expect:
    kind: intent
    objective: MINIMIZE_COST
    constraints: {minimum_soc_frac: 0.2}

- id: simple_03
  category: simple_valid
  request: "Minimise the peak demand charge."
  expect: {kind: intent, objective: MINIMIZE_PEAK}

- id: simple_04
  category: simple_valid
  request: "Maximise PV self-consumption."
  expect: {kind: intent, objective: MAXIMIZE_SELF_CONSUMPTION}

- id: simple_05
  category: simple_valid
  request: "Cut my carbon emissions."
  expect: {kind: intent, objective: MINIMIZE_EMISSIONS}

- id: simple_06
  category: simple_valid
  request: "Shift flexible loads away from peak-price hours."
  expect: {kind: intent, objective: MINIMIZE_COST}

- id: simple_07
  category: simple_valid
  request: "Lower the bills on 2020-09-21."
  expect:
    kind: intent
    objective: MINIMIZE_COST
    horizon_day: "2020-09-21"

- id: simple_08
  category: simple_valid
  request: "Flatten the load profile."
  expect: {kind: intent, objective: MINIMIZE_PEAK}

- id: simple_09
  category: simple_valid
  request: "Use my own solar rather than exporting it."
  expect: {kind: intent, objective: MAXIMIZE_SELF_CONSUMPTION}

- id: simple_10
  category: simple_valid
  request: "Make today greener."
  expect: {kind: intent, objective: MINIMIZE_EMISSIONS}

- id: simple_11
  category: simple_valid
  request: "Save money on electricity today."
  expect: {kind: intent, objective: MINIMIZE_COST}

- id: simple_12
  category: simple_valid
  request: "Reduce costs and keep at least 30% charge in the battery."
  expect:
    kind: intent
    objective: MINIMIZE_COST
    constraints: {minimum_soc_frac: 0.3}

# --- paraphrase: the same requests, phrased as a person actually would -------
# Predicted to be where the rule-based arm loses.

- id: paraphrase_01
  category: paraphrase
  request: "Trim the electricity bill for tomorrow."
  expect: {kind: intent, objective: MINIMIZE_COST}

- id: paraphrase_02
  category: paraphrase
  request: "Go easy on the grid connection during the busy hours."
  expect: {kind: intent, objective: MINIMIZE_PEAK}

- id: paraphrase_03
  category: paraphrase
  request: "I would rather burn my own sunshine than sell it."
  expect: {kind: intent, objective: MAXIMIZE_SELF_CONSUMPTION}

- id: paraphrase_04
  category: paraphrase
  request: "Keep the site's footprint down tomorrow."
  expect: {kind: intent, objective: MINIMIZE_EMISSIONS}

- id: paraphrase_05
  category: paraphrase
  request: "We are spending too much on power. Sort tomorrow out."
  expect: {kind: intent, objective: MINIMIZE_COST}

- id: paraphrase_06
  category: paraphrase
  request: "Stop the meter spinning so hard at teatime."
  expect: {kind: intent, objective: MINIMIZE_PEAK}

# --- complex valid ----------------------------------------------------------

- id: complex_01
  category: complex_valid
  request: "Cut costs tomorrow but never draw more than 400 kW from the grid."
  expect:
    kind: intent
    objective: MINIMIZE_COST
    constraints: {max_grid_import_mw: 0.4}

- id: complex_02
  category: complex_valid
  request: "Minimise cost on 2020-06-01 and do not export anything."
  expect:
    kind: intent
    objective: MINIMIZE_COST
    horizon_day: "2020-06-01"
    constraints: {allow_export: false}

- id: complex_03
  category: complex_valid
  request: "Compare a 1 MWh battery with a 2 MWh battery."
  expect: {kind: intent, comparison_count: 2}

- id: complex_04
  category: complex_valid
  request: "Reduce cost and shift the flexible load."
  expect: {kind: intent, objective: MINIMIZE_COST, shift_flexible_loads: true}

- id: complex_05
  category: complex_valid
  request: "Cut the bill but keep the battery between 20% and 80%."
  expect:
    kind: intent
    objective: MINIMIZE_COST
    constraints: {minimum_soc_frac: 0.2}

- id: complex_06
  category: complex_valid
  request: "Minimise emissions on 2019-01-11 without curtailing any solar."
  expect:
    kind: intent
    objective: MINIMIZE_EMISSIONS
    horizon_day: "2019-01-11"
    constraints: {allow_pv_curtailment: false}

- id: complex_07
  category: complex_valid
  request: "Lower the peak and hold export under 100 kW."
  expect:
    kind: intent
    objective: MINIMIZE_PEAK
    constraints: {max_grid_export_mw: 0.1}

- id: complex_08
  category: complex_valid
  request: "Compare a 0.5 MWh battery against a 4 MWh battery for cost."
  expect: {kind: intent, objective: MINIMIZE_COST, comparison_count: 2}

- id: complex_09
  category: complex_valid
  request: "Minimise cost tomorrow and finish the day at 50% charge."
  expect:
    kind: intent
    objective: MINIMIZE_COST
    constraints: {terminal_soc_frac: 0.5}

- id: complex_10
  category: complex_valid
  request: "Cut costs on 2019-07-27, keeping import under 0.5 MW."
  expect:
    kind: intent
    objective: MINIMIZE_COST
    horizon_day: "2019-07-27"
    constraints: {max_grid_import_mw: 0.5}

